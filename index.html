<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>꿈나무반 구구단 완전 정복</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Jua', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: clamp(10px, 3vw, 20px);
        }

        .card {
            background: white;
            border-radius: clamp(16px, 4vw, 28px);
            padding: clamp(15px, 4vw, 30px) clamp(12px, 3.5vw, 24px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: clamp(3px, 0.8vw, 5px) solid #10b981;
            position: relative;
        }

        .main-title {
            color: #047857;
            font-size: clamp(1.4rem, 5vw, 2.1rem);
            margin: 0 0 clamp(6px, 2vw, 12px) 0;
            text-shadow: 1px 1px 0px #a7f3d0;
            word-break: keep-all;
        }

        .sub-badge {
            display: inline-block;
            background-color: #d1fae5;
            color: #065f46;
            padding: 4px clamp(8px, 2vw, 14px);
            border-radius: 20px;
            font-size: clamp(0.85rem, 3vw, 1.05rem);
            margin-bottom: clamp(10px, 3vw, 18px);
        }

        input[type="text"], input[type="number"] {
            width: 90%;
            padding: clamp(8px, 2.5vw, 14px);
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            border: 3px solid #cbd5e1;
            border-radius: 12px;
            text-align: center;
            margin-bottom: clamp(10px, 2.5vw, 16px);
            outline: none;
        }

        input:focus { border-color: #10b981; }

        .btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: clamp(10px, 2.5vw, 14px) clamp(20px, 5vw, 32px);
            font-size: clamp(1.1rem, 3.8vw, 1.35rem);
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #059669;
            transition: all 0.1s;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #059669;
        }

        .btn:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        .level-btn {
            display: block;
            width: 100%;
            margin: clamp(8px, 2vw, 14px) 0;
            padding: clamp(12px, 3.5vw, 18px);
            font-size: clamp(1.05rem, 3.8vw, 1.3rem);
            border-radius: 16px;
            border: none;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }

        .btn-easy { background-color: #3b82f6; }
        .btn-medium { background-color: #f59e0b; }
        .btn-hard { background-color: #ef4444; }

        .progress-bar {
            width: 100%;
            height: clamp(12px, 2.5vw, 16px);
            background-color: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin: clamp(10px, 2.5vw, 15px) 0;
        }

        .progress-inner {
            height: 100%;
            background-color: #ef4444;
            width: 100%;
            transition: none;
        }

        .quiz-box {
            font-size: clamp(2.2rem, 9vw, 3.4rem);
            margin: clamp(8px, 2vw, 15px) 0;
            color: #1e293b;
            background-color: #f8fafc;
            padding: clamp(10px, 3vw, 16px);
            border-radius: 16px;
        }

        .feedback-box {
            min-height: clamp(30px, 6vw, 38px);
            font-size: clamp(0.95rem, 3.5vw, 1.2rem);
            font-weight: bold;
            margin-bottom: clamp(6px, 1.5vw, 10px);
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: keep-all;
        }
        .feedback-wrong { color: #dc2626; }
        .feedback-correct { color: #16a34a; }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(5px, 1.8vw, 10px);
            margin-top: clamp(8px, 2vw, 12px);
        }

        .key-btn {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            padding: clamp(10px, 2.5vw, 16px) 0;
            font-size: clamp(1.2rem, 4.5vw, 1.5rem);
            border-radius: 12px;
            cursor: pointer;
            color: #334155;
        }

        .key-btn:active { background-color: #cbd5e1; }
        .key-btn.delete { background-color: #fee2e2; color: #dc2626; }
        .key-btn.submit { background-color: #10b981; color: white; border: none; }

        .analysis-box {
            background-color: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 14px;
            padding: clamp(10px, 3vw, 16px);
            margin: clamp(10px, 2.5vw, 15px) 0;
            text-align: left;
        }

        .weak-tag {
            display: inline-block;
            background-color: #fee2e2;
            color: #dc2626;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: clamp(0.85rem, 2.8vw, 0.98rem);
            margin: 3px;
        }

        .screen { display: none; }
        .active { display: block; }

        @media (max-height: 650px) {
            .quiz-box { font-size: 2.2rem; margin: 4px 0; padding: 6px; }
            .key-btn { padding: 8px 0; font-size: 1.1rem; }
            .main-title { font-size: 1.4rem; margin-bottom: 4px; }
            .sub-badge { margin-bottom: 8px; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1 class="main-title">꿈나무반 구구단 완전 정복 🌳✨</h1>

    <!-- 1. 로그인 화면 -->
    <div id="screen-login" class="screen active">
        <span class="sub-badge">구구단 탐험대</span>
        <p style="font-size: clamp(0.95rem, 3.2vw, 1.1rem); color: #64748b;">반가워요! 이름을 입력해주세요.</p>
        <input type="text" id="nickname-input" placeholder="닉네임 입력" maxlength="8">
        <br>
        <button class="btn" onclick="startApp()">시작하기</button>
    </div>

    <!-- 2. 난이도 선택 화면 -->
    <div id="screen-level" class="screen">
        <p id="welcome-msg" style="font-size: clamp(1.05rem, 3.5vw, 1.25rem); color: #334155; font-weight: bold;"></p>
        <span class="sub-badge">도전할 난이도를 선택해 주세요!</span>
        
        <button id="btn-easy" class="level-btn btn-easy" onclick="startQuiz('초수')">🌱 초수 (문제당 8초)</button>
        <button id="btn-medium" class="level-btn btn-medium" onclick="startQuiz('중수')" disabled>🌿 중수 (문제당 6초) 🔒</button>
        <button id="btn-hard" class="level-btn btn-hard" onclick="startQuiz('고수')" disabled>🌳 고수 (문제당 4초) 🔒</button>
    </div>

    <!-- 3. 퀴즈 진행 화면 -->
    <div id="screen-quiz" class="screen">
        <div style="display: flex; justify-content: space-between; font-size: clamp(0.9rem, 3vw, 1.1rem); color: #475569;">
            <span id="quiz-progress">문제: 1/30</span>
            <span id="quiz-score">맞은 개수: 0</span>
        </div>
        
        <div class="progress-bar">
            <div id="timer-bar" class="progress-inner"></div>
        </div>

        <div class="quiz-box" id="problem-display">2 × 1 = ?</div>
        
        <div class="feedback-box" id="feedback-message"></div>

        <input type="number" id="answer-input" placeholder="정답" readonly>
        
        <div class="keypad">
            <button class="key-btn" onclick="appendNum(1)">1</button>
            <button class="key-btn" onclick="appendNum(2)">2</button>
            <button class="key-btn" onclick="appendNum(3)">3</button>
            <button class="key-btn" onclick="appendNum(4)">4</button>
            <button class="key-btn" onclick="appendNum(5)">5</button>
            <button class="key-btn" onclick="appendNum(6)">6</button>
            <button class="key-btn" onclick="appendNum(7)">7</button>
            <button class="key-btn" onclick="appendNum(8)">8</button>
            <button class="key-btn" onclick="appendNum(9)">9</button>
            <button class="key-btn delete" onclick="clearNum()">C</button>
            <button class="key-btn" onclick="appendNum(0)">0</button>
            <button class="key-btn submit" id="btn-submit" onclick="submitAnswer()">확인</button>
        </div>
    </div>

    <!-- 4. 결과 화면 -->
    <div id="screen-result" class="screen">
        <h2 id="result-title" style="font-size: clamp(1.4rem, 5vw, 1.8rem); margin: 10px 0;">결과</h2>
        <p id="result-desc" style="font-size: clamp(1.05rem, 3.5vw, 1.25rem); margin: 10px 0;"></p>
        
        <div class="analysis-box">
            <div style="font-weight: bold; color: #334155; margin-bottom: 6px; font-size: clamp(0.95rem, 3.2vw, 1.1rem);">📊 약점 분석 리포트</div>
            <div id="analysis-content"></div>
        </div>

        <button class="btn" onclick="showLevelScreen()">난이도 선택으로</button>
    </div>
</div>

<script>
    // ★ 구글 앱스클립트 웹앱 URL을 입력하세요 ★
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwswv920NFXmm8tDsimm9B1mbA4q4mTr1VNt1M3YfoPqleH2Ei9lQFCUD1PilhnZiA_/exec";

    let nickname = "";
    let currentLevel = "초수";
    let unlockedLevel = 1;
    
    let problemCount = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let currentNum1 = 0;
    let currentAns = 0;
    let isProcessing = false;
    
    let problemDeck = []; // 중복 방지용 전체 문제 덱
    let tableStats = {};
    let animFrameId = null;
    let startTime = 0;
    const TOTAL_PROBLEMS = 30;
    const PASS_THRESHOLD = 25;

    const LEVEL_CONFIG = {
        '초수': { time: 8 },
        '중수': { time: 6 },
        '고수': { time: 4 }
    };

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startApp() {
        const input = document.getElementById('nickname-input').value.trim();
        if (!input) {
            alert('닉네임을 입력해 주세요!');
            return;
        }
        nickname = input;
        showLevelScreen();
    }

    function showLevelScreen() {
        document.getElementById('welcome-msg').innerText = `${nickname} 어린이, 화이팅!`;
        
        const btnMed = document.getElementById('btn-medium');
        btnMed.disabled = unlockedLevel < 2;
        btnMed.innerText = unlockedLevel >= 2 ? "🌿 중수 (문제당 6초)" : "🌿 중수 (문제당 6초) 🔒";
        
        const btnHard = document.getElementById('btn-hard');
        btnHard.disabled = unlockedLevel < 3;
        btnHard.innerText = unlockedLevel >= 3 ? "🌳 고수 (문제당 4초)" : "🌳 고수 (문제당 4초) 🔒";
        
        showScreen('screen-level');
    }

    // 2~9단 중복 없는 72개 문제 생성 및 셔플 로직
    function buildProblemDeck() {
        let deck = [];
        for (let num1 = 2; num1 <= 9; num1++) {
            for (let num2 = 1; num2 <= 9; num2++) {
                deck.push({ num1, num2, ans: num1 * num2 });
            }
        }
        
        // 피셔-예이츠 셔플 알고리즘
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }

        // 같은 단이 연속 3번 이상 안 겹치도록 미세 조정
        for (let i = 1; i < deck.length - 1; i++) {
            if (deck[i].num1 === deck[i - 1].num1 && deck[i].num1 === deck[i + 1].num1) {
                const swapIdx = (i + 5) % deck.length;
                [deck[i], deck[swapIdx]] = [deck[swapIdx], deck[i]];
            }
        }

        return deck;
    }

    function startQuiz(level) {
        currentLevel = level;
        problemCount = 0;
        correctCount = 0;
        wrongCount = 0;

        // 30개 문제 무작위 덱 생성 (중복 제로)
        problemDeck = buildProblemDeck();

        tableStats = {};
        for (let i = 2; i <= 9; i++) {
            tableStats[i] = { total: 0, wrong: 0 };
        }

        showScreen('screen-quiz');
        nextProblem();
    }

    function stopTimer() {
        if (animFrameId) {
            cancelAnimationFrame(animFrameId);
            animFrameId = null;
        }
    }

    function nextProblem() {
        stopTimer();

        if (problemCount >= TOTAL_PROBLEMS) {
            finishQuiz();
            return;
        }

        isProcessing = false;
        problemCount++;
        document.getElementById('quiz-progress').innerText = `문제: ${problemCount}/${TOTAL_PROBLEMS}`;
        document.getElementById('quiz-score').innerText = `맞은 개수: ${correctCount}`;
        document.getElementById('feedback-message').innerText = '';
        document.getElementById('feedback-message').className = 'feedback-box';

        // 덱에서 중복 없는 문제 추출
        const prob = problemDeck.pop();
        currentNum1 = prob.num1;
        currentAns = prob.ans;

        tableStats[currentNum1].total++;

        document.getElementById('problem-display').innerText = `${prob.num1} × ${prob.num2} = ?`;
        document.getElementById('answer-input').value = '';

        const timerBar = document.getElementById('timer-bar');
        timerBar.style.width = '100%';

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                startTimer();
            });
        });
    }

    function startTimer() {
        stopTimer();
        
        const timerBar = document.getElementById('timer-bar');
        const duration = LEVEL_CONFIG[currentLevel].time * 1000;
        startTime = performance.now();

        function updateTimer(now) {
            const elapsed = now - startTime;
            const remainingRatio = Math.max(0, (duration - elapsed) / duration);
            
            timerBar.style.width = (remainingRatio * 100) + '%';

            if (elapsed < duration) {
                if (!isProcessing) {
                    animFrameId = requestAnimationFrame(updateTimer);
                }
            } else {
                if (!isProcessing) {
                    isProcessing = true;
                    wrongCount++;
                    tableStats[currentNum1].wrong++;
                    
                    showFeedback(`⏰ 시간 초과! 정답은 ${currentAns}입니다.`, false);
                    setTimeout(nextProblem, 1200);
                }
            }
        }

        animFrameId = requestAnimationFrame(updateTimer);
    }

    function appendNum(num) {
        if (isProcessing) return;
        const input = document.getElementById('answer-input');
        if (input.value.length < 3) {
            input.value += num;
        }
    }

    function clearNum() {
        if (isProcessing) return;
        document.getElementById('answer-input').value = '';
    }

    function submitAnswer() {
        if (isProcessing) return;
        
        const inputVal = document.getElementById('answer-input').value;
        if (inputVal === '') return;

        stopTimer();
        isProcessing = true;
        
        const userAns = parseInt(inputVal);

        if (userAns === currentAns) {
            correctCount++;
            showFeedback('🎉 정답이에요!', true);
            setTimeout(nextProblem, 500);
        } else {
            wrongCount++;
            tableStats[currentNum1].wrong++;
            showFeedback(`😅 아쉬워요! 정답은 ${currentAns}입니다.`, false);
            setTimeout(nextProblem, 1200);
        }
    }

    function showFeedback(msg, isCorrect) {
        const fb = document.getElementById('feedback-message');
        fb.innerText = msg;
        fb.className = isCorrect ? 'feedback-box feedback-correct' : 'feedback-box feedback-wrong';
    }

    function finishQuiz() {
        stopTimer();
        const isPassed = correctCount >= PASS_THRESHOLD;
        
        if (isPassed) {
            if (currentLevel === '초수' && unlockedLevel < 2) unlockedLevel = 2;
            if (currentLevel === '중수' && unlockedLevel < 3) unlockedLevel = 3;
        }

        const resultTitle = document.getElementById('result-title');
        const resultDesc = document.getElementById('result-desc');

        if (isPassed) {
            resultTitle.innerText = "🎉 통과를 축하합니다!";
            resultTitle.style.color = "#10b981";
            resultDesc.innerText = `${correctCount}개를 맞춰서 ${currentLevel} 단계를 통과했어요!`;
        } else {
            resultTitle.innerText = "😅 아쉽네요, 재도전!";
            resultTitle.style.color = "#ef4444";
            resultDesc.innerText = `${correctCount}개 맞췄어요. 25개 이상 맞춰야 통과예요!`;
        }

        const weakList = analyzeWeakness();
        showScreen('screen-result');

        sendResultToGoogleSheet(isPassed, weakList.join(", "));
    }

    function analyzeWeakness() {
        const analysisContent = document.getElementById('analysis-content');
        let weakTables = [];

        for (let t = 2; t <= 9; t++) {
            if (tableStats[t].wrong > 0) {
                weakTables.push({
                    table: t,
                    wrong: tableStats[t].wrong,
                    total: tableStats[t].total
                });
            }
        }

        weakTables.sort((a, b) => b.wrong - a.wrong);

        if (weakTables.length === 0) {
            analysisContent.innerHTML = `<p style="color:#16a34a; margin: 5px 0;">✨ 틀린 문제가 없어요! 구구단 완벽 마스터!</p>`;
            return ["없음"];
        } else {
            let html = `<p style="margin: 3px 0; color: #475569; font-size: 0.95rem;">다음 단을 더 연습해 보세요:</p>`;
            const weakNames = [];
            
            weakTables.forEach(item => {
                html += `<span class="weak-tag">⚠️ ${item.table}단 (${item.total}문제 중 ${item.wrong}개 틀림)</span>`;
                weakNames.push(`${item.table}단`);
            });
            
            analysisContent.innerHTML = html;
            return weakNames;
        }
    }

    function sendResultToGoogleSheet(isPassed, weakTablesStr) {
        if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === "YOUR_APPS_SCRIPT_URL_HERE") return;

        const data = {
            nickname: nickname,
            level: currentLevel,
            score: correctCount,
            wrong: wrongCount,
            weakTables: weakTablesStr,
            passed: isPassed
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).catch(err => console.error("전송 실패:", err));
    }

    document.addEventListener('keydown', (e) => {
        if (document.getElementById('screen-quiz').classList.contains('active')) {
            if (e.key >= '0' && e.key <= '9') {
                appendNum(parseInt(e.key));
            } else if (e.key === 'Backspace') {
                clearNum();
            } else if (e.key === 'Enter') {
                submitAnswer();
            }
        }
    });
</script>
</body>
</html>
